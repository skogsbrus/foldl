[package]
name = "foldl"
description = "Run code when a shell enters or leaves a folder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["direnv", "shell", "environment", "worktree", "nix"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[[bin]]
name = "foldl"
path = "src/main.rs"

[dependencies]
foldl-core = { path = "../foldl-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
sha2 = "0.10"
similar = "2"
rustix = { version = "1", features = ["process", "event", "fs", "pipe", "stdio"] }
libc = "0.2"
signal-hook = "0.3"

[dev-dependencies]
proptest = "1"
tempfile = "3"

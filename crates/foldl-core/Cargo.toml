[package]
name = "foldl-core"
description = "Pure core of foldl: state, events, effects and the step function"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["direnv", "shell", "environment"]
categories = ["development-tools"]

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
globset = { version = "0.4", default-features = false }

[dev-dependencies]
proptest = "1"

# Compile, lint, and test with the 100% line-coverage gate, on Linux and
# macOS. Each step builds a flake check, as `nix flake check` does locally.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: System
        run: echo "SYSTEM=$(nix eval --impure --raw --expr builtins.currentSystem)" >> "$GITHUB_ENV"
      - name: Compile
        run: nix build -L ".#checks.$SYSTEM.build"
      - name: Lint
        run: nix build -L ".#checks.$SYSTEM.fmt" ".#checks.$SYSTEM.clippy"
      # THIRD_PARTY_LICENSES.md must match Cargo.lock.
      - name: Licenses
        run: nix build -L ".#checks.$SYSTEM.licenses"
      # Runs the whole suite under cargo llvm-cov; fails below 100% lines.
      - name: Test and coverage
        run: nix build -L ".#checks.$SYSTEM.coverage"
